# Checks on every pull request and on main: lint, typecheck, unit tests, the package builds, the
# Storybook build and axe on every story in a browser; screenshots of every story are only reported
# (visual/README.md). "CI passed" is the one required check (handbook: core/github.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by "Update screenshots" after it commits, since its own push doesn't start CI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds tokens first: Storybook loads the generated tokens.css.
      - run: pnpm build
      - run: pnpm build-storybook
      # The showcase on GitHub Pages, built against the packages' dist/ as an app gets them.
      - run: pnpm build-site
      - name: Pack (what would be published)
        run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"

  visual:
    name: Accessibility and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image pins the browser and fonts, so pictures match to the pixel on every run
    # and with `pnpm visual:docker`. Its version moves together with @playwright/test (Renovate).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      # Blocks the merge: an accessibility finding is a bug.
      - name: Accessibility (axe, light and dark)
        run: pnpm visual a11y --reporter=list
      # Only reports: a changed picture is often intended, so it never blocks a merge or auto-merge.
      - name: Screenshots (report only)
        id: pictures
        continue-on-error: true
        run: pnpm visual screenshots
      - name: Note the changed pictures
        if: steps.pictures.outcome == 'failure'
        run: |
          echo "::warning title=Screenshots differ::Some stories look different from visual/__screenshots__. See the screenshot-report artifact. If the change is meant, add the label update-screenshots to the pull request."
          {
            echo "### Screenshots differ"
            echo "Some stories look different from the reference pictures. This doesn't block the merge."
            echo "Download **screenshot-report** below to see expected, actual and diff. If the change is meant, add the label \`update-screenshots\` to the pull request."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.pictures.outcome == 'failure' || failure())
        with:
          name: screenshot-report
          path: playwright-report

  ci-passed:
    name: CI passed
    if: always()
    needs: [check, visual]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          VISUAL: ${{ needs.visual.result }}
        run: test "$CHECK" = success && test "$VISUAL" = success
