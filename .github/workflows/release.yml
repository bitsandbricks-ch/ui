# Publishes the packages to npm (npmjs.com, public) when Mike pushes a release tag (v0.2.0), then creates
# the GitHub release from the changelog (handbook decision 0014: the release comes last, so an
# immutable release never points at something that failed to publish). Versions come from
# changesets: `pnpm version-packages` in a pull request, merged, then the tag. Nothing here changes
# a version or pushes a tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Mike approves each publish (Settings > Environments > release > required reviewers).
    environment: release
    # id-token: write lets npm trusted publishing (OIDC) publish without a token and add provenance.
    # Each package's Trusted Publisher on npmjs.com names bitsandbricks-ch/ui, release.yml and the
    # release environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Every package's version must match the tag, so a tag never publishes something else.
      - name: Check versions against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-versions.mjs "$TAG"
      # pnpm packs (it turns workspace:^ into real versions); npm publishes, because trusted
      # publishing needs npm 11.5.1 or later. No token: npm gets a short-lived one through OIDC.
      - name: Publish
        env:
          PACK_DIR: ${{ runner.temp }}/pack
        run: |
          node -e 'const v = process.argv[1].split(".").map(Number); if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) { console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`); process.exit(1) }' "$(npm --version)"
          pnpm -r pack --pack-destination "$PACK_DIR"
          for tarball in "$PACK_DIR"/*.tgz; do
            npm publish "$tarball" --access public
          done

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Notes are this version's section of the ui package's changelog (all packages share one version).
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists already"; exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' packages/ui/CHANGELOG.md > notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
