# Checks on every pull request and on main: lint, typecheck, unit tests, the package builds, the
# Storybook build and a screenshot of every story (visual/README.md). "CI passed" is the one
# required check (handbook: core/github.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds tokens first: Storybook loads the generated tokens.css.
      - run: pnpm build
      - run: pnpm build-storybook
      - name: Pack (what would be published)
        run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"

  visual:
    name: Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image pins the browser and fonts, so pictures match to the pixel on every run
    # and with `pnpm visual:docker`. Its version moves together with @playwright/test (Renovate).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm visual
      # A changed or new story: take its new pictures so they can be reviewed and committed
      # (download the "screenshots" artifact and unpack it into visual/__screenshots__).
      - name: New pictures for the stories that changed
        if: failure()
        run: pnpm visual --last-failed --update-snapshots=changed || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: visual/__screenshots__
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshot-report
          path: playwright-report

  ci-passed:
    name: CI passed
    if: always()
    needs: [check, visual]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          CHECK: ${{ needs.check.result }}
          VISUAL: ${{ needs.visual.result }}
        run: test "$CHECK" = success && test "$VISUAL" = success
