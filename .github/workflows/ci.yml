# Checks on every pull request and on main: lint, typecheck, unit tests, the package builds and the
# Storybook build. "CI passed" is the one required check (handbook: core/github.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds tokens first: Storybook loads the generated tokens.css.
      - run: pnpm build
      - run: pnpm build-storybook
      - name: Pack (what would be published)
        run: pnpm -r exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"

  ci-passed:
    name: CI passed
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
